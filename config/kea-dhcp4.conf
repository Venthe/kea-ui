{
  "Dhcp4": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so"
      }
    ],
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ]
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/dhcp4.sock"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp4.leases"
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [
          {
            "pool": "192.168.50.100-192.168.50.200"
          }
        ],
        "option-data": [
          {
            "name": "domain-name-servers",
            "data": "192.168.50.22"
          },
          {
            "name": "routers",
            "data": "192.168.50.1"
          },
          {
            "name": "ntp-servers",
            "data": "192.168.50.30"
          },
          {
            "name": "domain-name",
            "data": "dhcp.home.arpa"
          }
        ]
      }
    ]
  }
}