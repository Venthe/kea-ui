<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kea UI Login</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17202a; color: #e9eef2; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(360px, calc(100% - 2rem)); padding: 1.5rem; background: #252b2f; border: 1px solid #3a454b; border-radius: 6px; }
    h1 { margin: 0 0 1.5rem; } form { display: grid; gap: 1rem; } label { display: grid; gap: .35rem; color: #aebbc3; font-size: .85rem; }
    input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #58666f; border-radius: 4px; background: #1e2428; color: inherit; font: inherit; }
    button { padding: .7rem; border: 0; border-radius: 4px; background: #2d8997; color: white; font: inherit; cursor: pointer; }
    .error { padding: .7rem; border-left: 4px solid #c94b53; background: #51272a; margin-bottom: 1rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Kea UI</h1>
    {% if error %}<div class="error" role="alert">{{ error }} </div>{% endif %}
    <form method="post" action="/login">
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
